<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PricePulse AI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h1 class="mb-4 fw-bold">PricePulse AI Intelligence Tracker</h1>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm border-0">
                    <h5>Add Product</h5>
                    <form id="add-product-form">
                        <div class="mb-2"><input type="text" class="form-control" id="prod-name" placeholder="Name" required></div>
                        <div class="mb-2"><input type="url" class="form-control" id="prod-url" placeholder="URL" required></div>
                        <div class="mb-2"><input type="text" class="form-control" id="prod-site" placeholder="Website" required></div>
                        <div class="mb-2"><input type="number" step="0.01" class="form-control" id="prod-target" placeholder="Target Price (₹)"></div>
                        <button type="submit" class="btn btn-primary w-100">Add Product</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-3 shadow-sm border-0">
                    <h5>Monitored Products</h5>
                    <table class="table">
                        <thead><tr><th>Name</th><th>Website</th><th>Price</th><th>Target</th><th>Action</th></tr></thead>
                        <tbody id="product-table-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
